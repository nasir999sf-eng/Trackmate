<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackMate | Live Location</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f7fa;
    color: #202936;
}

.header {
    background: white;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e5e7eb;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    letter-spacing: -1px;
}

.logo span {
    color: #3979d9;
}

.status {
    font-size: 12px;
    color: #16865a;
    background: #e7f7ef;
    padding: 7px 10px;
    border-radius: 20px;
}

.container {
    padding: 16px;
}

.heading {
    margin: 8px 0 15px;
}

.heading h2 {
    font-size: 21px;
    margin-bottom: 5px;
}

.heading p {
    color: #788391;
    font-size: 13px;
}

.search {
    width: 100%;
    padding: 15px;
    border: 1px solid #dfe3e8;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    margin-bottom: 13px;
    background: white;
}

.search:focus {
    border-color: #3979d9;
}

.map-box {
    height: 55vh;
    min-height: 350px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #e0e5eb;
    position: relative;
}

#map {
    height: 100%;
    width: 100%;
}

.count {
    background: white;
    padding: 13px;
    margin-top: 13px;
    border-radius: 12px;
    border: 1px solid #e5e7eb;
    font-size: 14px;
}

.count strong {
    color: #3979d9;
}

.info {
    display: none;
    background: white;
    padding: 17px;
    margin-top: 13px;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 5px 20px #0000000a;
}

.info h3 {
    margin-bottom: 10px;
}

.info p {
    color: #657181;
    font-size: 13px;
    margin: 8px 0;
}

.close {
    float: right;
    border: none;
    background: #eef1f5;
    padding: 7px 11px;
    border-radius: 8px;
}

.footer {
    text-align: center;
    padding: 20px;
    color: #929ba7;
    font-size: 12px;
}

.student-marker {
    background: #3979d9;
    color: white;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 2px 8px #0004;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">Track<span>Mate</span></div>
    <div class="status">● Prototype</div>
</header>

<main class="container">

    <section class="heading">
        <h2>Trip dashboard</h2>
        <p>See where your group is on the map.</p>
    </section>

    <input
        class="search"
        id="search"
        type="search"
        placeholder="Search a student..."
        autocomplete="off"
    >

    <div class="map-box">
        <div id="map"></div>
    </div>

    <div class="count">
        Students on map: <strong id="studentCount">4</strong>
    </div>

    <div class="info" id="info">
        <button class="close" onclick="closeCard()">✕</button>
        <h3 id="studentName">Student</h3>
        <p id="studentStatus">Status: Sample location</p>
        <p id="coordinates">Coordinates: —</p>
        <p>GPS accuracy: Demo data</p>
    </div>

</main>

<footer class="footer">
    TrackMate · Location-sharing prototype
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([28.6139, 77.2090], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// FICTIONAL DEMO LOCATIONS ONLY
const students = [
    {
        name: "Nasir",
        initials: "NS",
        lat: 28.6139,
        lng: 77.2090
    },
    {
        name: "Aman",
        initials: "AH",
        lat: 28.6200,
        lng: 77.2150
    },
    {
        name: "Rahul",
        initials: "RK",
        lat: 28.6060,
        lng: 77.2000
    },
    {
        name: "Naseem",
        initials: "NA",
        lat: 28.6300,
        lng: 77.1950
    }
];

const markers = [];

students.forEach(student => {

    const icon = L.divIcon({
        className: '',
        html: `<div class="student-marker">${student.initials}</div>`,
        iconSize: [38, 38],
        iconAnchor: [19, 19]
    });

    const marker = L.marker(
        [student.lat, student.lng],
        { icon: icon }
    ).addTo(map);

    marker.on('click', () => showCard(student));

    markers.push({
        student: student,
        marker: marker
    });

});

function showCard(student) {

    document.getElementById('info').style.display = 'block';

    document.getElementById('studentName').textContent = student.name;

    document.getElementById('studentStatus').textContent =
        'Status: Sample location';

    document.getElementById('coordinates').textContent =
        `Coordinates: ${student.lat.toFixed(5)}, ${student.lng.toFixed(5)}`;

    map.setView([student.lat, student.lng], 15);
}

function closeCard() {
    document.getElementById('info').style.display = 'none';
}

document.getElementById('search').addEventListener('input', function() {

    const query = this.value.toLowerCase().trim();

    if (!query) return;

    const found = students.find(student =>
        student.name.toLowerCase().includes(query)
    );

    if (found) {
        showCard(found);
    }

});

document.getElementById('studentCount').textContent = students.length;

</script>

</body>
</html>
